name: iOS build (macOS en la nube)

# Compila el IPA en un runner macOS de GitHub Actions, sin necesidad de tener una Mac.
# Ejecucion manual desde la pestania Actions del repositorio.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Configuracion de compilacion
        default: Release
        type: choice
        options: [Release, Debug]

jobs:
  build:
    # macos-26 trae Xcode 26.x, que es lo que exige el SDK de .NET para iOS.
    # macos-15 tiene Xcode 16.4 y falla con "requires Xcode 26.6".
    # En repos privados los minutos de macOS consumen 10x del cupo.
    runs-on: macos-26

    env:
      # `secrets` no se puede evaluar dentro de un `if:` de step, asi que se
      # promueve a variable de entorno y la condicion mira `env`.
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar el Xcode mas reciente disponible
        run: |
          ls /Applications | grep -i "^Xcode" || true
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Usando $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      # Aunque se compile solo -f net10.0-ios, MSBuild evalua TODOS los TargetFrameworks
      # del csproj y exige tambien el workload de Android. Por eso se instalan los dos.
      - name: Instalar workloads de MAUI
        run: dotnet workload install maui-ios maui-android --skip-sign-check

      # nuget-local/ no se versiona (son binarios). El CI regenera el paquete Base
      # desde el fuente, que es la unica fuente de verdad.
      - name: Regenerar el paquete local AstraSystemsRental.Base
        run: |
          mkdir -p nuget-local
          # dotnet pack sin un build previo empaqueta un binario obsoleto (o falla si no existe).
          dotnet build AstraSystemsRental.Base/src/AstraSystemsRental.Base/AstraSystemsRental.Base.csproj -c Release
          dotnet pack AstraSystemsRental.Base/src/AstraSystemsRental.Base/AstraSystemsRental.Base.csproj             -c Release -o nuget-local --no-build

      # Sin certificado de firma se compila para simulador: sirve para confirmar que
      # el proyecto compila en iOS y revisar la UI, pero NO se instala en un iPhone.
      - name: Compilar para simulador (sin firma)
        if: env.HAS_SIGNING != 'true'
        run: |
          dotnet build AstraSystemsRental.Mobile/src/AstraSystemsRental.Mobile/AstraSystemsRental.Mobile.csproj \
            -f net10.0-ios -c ${{ inputs.configuration }} \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:CodesignKey=""

      - name: Importar certificado de firma
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner build.keychain
          rm -f /tmp/cert.p12

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/astra.mobileprovision

      - name: Compilar IPA firmado
        if: env.HAS_SIGNING == 'true'
        run: |
          dotnet publish AstraSystemsRental.Mobile/src/AstraSystemsRental.Mobile/AstraSystemsRental.Mobile.csproj \
            -f net10.0-ios -c ${{ inputs.configuration }} \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CodesignProvision="${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}" \
            -p:CodesignKey="${{ secrets.APPLE_SIGNING_IDENTITY }}"

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: astrasystems-ios-${{ inputs.configuration }}
          path: |
            **/bin/${{ inputs.configuration }}/net10.0-ios/**/*.ipa
            **/bin/${{ inputs.configuration }}/net10.0-ios/**/*.app
          if-no-files-found: warn
