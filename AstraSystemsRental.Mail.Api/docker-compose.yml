services:
  api-mail:
    build:
      context: ..
      dockerfile: AstraSystemsRental.Mail.Api/Dockerfile
    image: astra-api-mail:latest
    container_name: astra-api-mail
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - Internal__ApiKey=${INTERNAL_API_KEY}
      - Gmail__User=${GMAIL_USER}
      - Gmail__AppPassword=${GMAIL_APP_PASSWORD}
      - Gmail__FromAddress=${GMAIL_FROM_ADDRESS}
      - Gmail__FromName=${GMAIL_FROM_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - astra
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/apiMail/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  astra:
    name: astra
    driver: bridge
